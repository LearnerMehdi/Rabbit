# Postgres + pgvector for Orange Reader. Started by ./start.sh; the credentials
# must match database.url in config.yaml. Compose project "rabbit", volume rabbit_pgdata.
name: rabbit

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: orange-rabbit-db
    environment:
      POSTGRES_USER: rabbit
      POSTGRES_PASSWORD: rabbit
      POSTGRES_DB: orange_rabbit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied when the volume is first created; start.sh re-applies it (idempotent) on every start.
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabbit -d orange_rabbit"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
